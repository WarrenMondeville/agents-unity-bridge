[build-system]
requires = ["setuptools>=82.0.1,<83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-unity-bridge"
version = "0.7.0"
description = "Control Unity Editor from AI agents — run tests, compile, get logs, build, and more via a file-based bridge"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
keywords = [
    "unity",
    "agent",
    "ai",
    "agents",
    "game-development",
    "unity-editor",
    "automation",
    "testing",
    "bridge",
    "cli",
    "ai-agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/WarrenMondeville/harness-unity-bridge"
Repository = "https://github.com/WarrenMondeville/harness-unity-bridge"
Issues = "https://github.com/WarrenMondeville/harness-unity-bridge/issues"
Changelog = "https://github.com/WarrenMondeville/harness-unity-bridge/releases"
PyPI = "https://pypi.org/project/harness-unity-bridge/"

[project.scripts]
agents-unity-bridge = "agents_unity_bridge.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "black>=23.0", "flake8>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.package-data]
agents_unity_bridge = ["skill/*.md", "skill/references/*.md"]
